<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Painel · Thais Matos</title>
  <link rel="stylesheet" href="assets/css/painel.css">
</head>
<body>
  <header class="cabeca">
    <div>
      <p class="cabeca__marca">Thais Matos</p>
      <h1 class="cabeca__titulo">Painel do site</h1>
    </div>
    <a class="botao botao--linha" href="index.html" target="_blank" rel="noopener">Ver o site</a>
  </header>

  <div class="faixa-aviso" role="note">
    <p><strong>As alterações ficam salvas só neste navegador.</strong> Para todo mundo ver, use "Exportar arquivo" e envie para a TRIRREME publicar.</p>
  </div>

  <div class="layout">
    <nav class="abas" role="tablist" aria-label="Partes do painel" data-abas>
      <button role="tab" type="button" id="aba-encomendas" aria-controls="painel-encomendas" aria-selected="true">Encomendas</button>
      <button role="tab" type="button" id="aba-livros" aria-controls="painel-livros" aria-selected="false" tabindex="-1">Livros</button>
      <button role="tab" type="button" id="aba-obras" aria-controls="painel-obras" aria-selected="false" tabindex="-1">Obras</button>
      <button role="tab" type="button" id="aba-textos" aria-controls="painel-textos" aria-selected="false" tabindex="-1">Contatos e textos</button>
      <button role="tab" type="button" id="aba-arquivo" aria-controls="painel-arquivo" aria-selected="false" tabindex="-1">Arquivo</button>
    </nav>

    <main class="conteudo">
      <section class="painel" role="tabpanel" id="painel-encomendas" aria-labelledby="aba-encomendas" data-painel="encomendas"></section>
      <section class="painel" role="tabpanel" id="painel-livros" aria-labelledby="aba-livros" data-painel="livros" hidden></section>
      <section class="painel" role="tabpanel" id="painel-obras" aria-labelledby="aba-obras" data-painel="obras" hidden></section>
      <section class="painel" role="tabpanel" id="painel-textos" aria-labelledby="aba-textos" data-painel="textos" hidden></section>
      <section class="painel" role="tabpanel" id="painel-arquivo" aria-labelledby="aba-arquivo" data-painel="arquivo" hidden></section>
    </main>
  </div>

  <footer class="barra-salvar">
    <p class="barra-salvar__estado" data-estado role="status" aria-live="polite">Nenhuma alteração.</p>
    <p class="barra-salvar__espaco" data-espaco></p>
    <button class="botao botao--escuro" type="button" data-salvar>Salvar alterações</button>
  </footer>

  <script src="assets/js/conteudo-padrao.js"></script>
  <script src="assets/js/dados.js"></script>
  <script src="assets/js/painel.js"></script>
</body>
</html>
